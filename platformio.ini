; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;

; ================================================
; See docs for configuration options and examples:
; https://docs.slimevr.dev/firmware/configuring-project.html#1-configuring-platformioini
; ================================================

[platformio]
build_cache_dir = cache

[env]
lib_deps=
  https://github.com/SlimeVR/CmdParser.git
  https://github.com/SlimeVR/base64_arduino.git
  https://github.com/adafruit/Adafruit-MCP23017-Arduino-Library.git
  https://github.com/hideakitai/PCA9547.git
monitor_speed = 115200
monitor_echo = yes
monitor_filters = colorize
;monitor_rts = 0
;monitor_dtr = 0
framework = arduino
build_flags = 
  !python scripts/get_git_commit.py
;If you want to set hardcoded WiFi SSID and password, uncomment and edit the lines below
;To uncomment, only remove ";" and leave the two spaces in front of the tags
; '" - quotes are necessary!
;  -DWIFI_CREDS_SSID='"SSID"'
;  -DWIFI_CREDS_PASSWD='"PASSWORD"'

;If you want to set a static IP address, uncomment and edit the lines below
;  -DWIFI_USE_STATICIP
;  -DWIFI_STATIC_IP=192,168,XXX,XXX
;  -DWIFI_STATIC_GATEWAY=192,168,XXX,XXX
;  -DWIFI_STATIC_SUBNET=255,255,255,0

;  -DSERVER_IP='"192.168.XXX.XXX"'
;  -DSERVER_PORT=6969

; Uncomment below if your board are using 40MHz crystal instead of 26MHz for ESP8266
;  -DF_CRYSTAL=40000000

; Enable -O2 GCC optimization
  -O2
  -std=gnu++2a

build_unflags = -Os -std=gnu++11 -std=gnu++17

; If you want to enable OTA Updates, uncomment and set OTA password here and in credentials.h
; You can set upload_port to device's ip after it's set up for the first time
; Use the same password in SlimeVR Server to let it OTA Update the device
;upload_protocol = espota
;upload_port = 192.168.1.49
;upload_flags =
;  --auth=SlimeVR-OTA

; Settings for different boards

[env:esp32c3]
; pioarduino 55.03.312-1 (arduino-esp32 3.3.12 / ESP-IDF 5.5.5).
;
; A 3.x core is required, not optional: src/network/packets.h uses C++20
; explicit(bool), which needs GCC 11+; the 2.0.x core (GCC 8.4.0) cannot compile
; it. And 3.0.4 is the last arduino-esp32 release that still ships
; tools/platformio-build.py, so it is both the newest core the stock
; espressif32@6.7.0 platform can build AND the one whose WiFi driver crashes on
; this board. Everything newer needs pioarduino's builder.
;
; pioarduino's platform.json points every toolchain at a ~1.6 KB metadata stub in
; pioarduino/registry 0.0.1 (no `packages` entry, no binaries), and the owner it
; names -- pioarduino/toolchain-riscv32-esp -- does not exist in the registry,
; which is why a plain pioarduino build dies with "riscv32-esp-elf-g++ is not
; recognized". Pinning the toolchain to the platformio/ owner, which does carry
; the exact version pioarduino asks for, is the workaround.
; Revert to the 3.0.4 espressif32@6.7.0 block if this does not build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
platform_packages =
  platformio/toolchain-riscv32-esp @ 14.2.0+20260121
build_flags =
  ${env.build_flags}
  -DESP32C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
board = lolin_c3_mini
; default.csv gives each OTA slot 1.25 MB, which the 3.0.4 image overflows.
board_build.partitions = partitions_custom.csv
; The native USB-CDC link on this board drops at the default 460800 baud and the
; stub loader fails on it. Both are needed for every flash.
upload_speed = 115200
upload_flags = --no-stub
monitor_filters = colorize, esp32_exception_decoder

; This env builds for every unit. Per-unit mounting corrections -- the two
; upper-arm boards have their IMUs soldered 180 deg out -- are not compiled in:
; each tracker is turned the right way up by the SlimeVR server once it connects.
